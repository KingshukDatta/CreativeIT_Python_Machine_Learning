<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentiment Analysis System</title>
    <style>
      /* General page styling */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      /* The main white box */
      .container {
        background-color: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        text-align: center;
      }
      h2 {
        color: #333;
        margin-bottom: 20px;
      }
      /* Text area styling */
      input {
        width: 100%;
        height: 150px;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        resize: none;
        font-size: 16px;
        box-sizing: border-box;
        margin-bottom: 20px;
        font-family: inherit;
      }
      input:focus {
        outline: none;
        border-color: #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
      }
      /* Button styling */
      button {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s;
        width: 100%;
      }
      button:hover {
        background-color: #45a049;
      }
      /* Result box styling */
      #result-box {
        margin-top: 25px;
        padding: 15px;
        border-radius: 6px;
        font-size: 18px;
        font-weight: bold;
        display: none; /* Hidden by default until a prediction is made */
      }
      .positive {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .negative {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .loading {
        color: #666;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Sentiment Analysis System</h2>

      <form action="/predict" method="POST">
        <input
          type="text"
          name="review_text"
          id="reviewInput"
          placeholder="Enter your English or Bangla text here..."
          required
        />
        <button type="submit">Predict Sentiment</button>
      </form>

      {% if final_result %}
      <div id="result-box" class="{{ result_color }}" style="display: block">
        Sentiment: {{ final_result }}
      </div>
      {% endif %}
    </div>
  </body>
</html>
